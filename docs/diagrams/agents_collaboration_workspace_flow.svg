<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">Agents 协同工作与工作区流转</title>
  <desc id="desc">展示用户、总控 Agent、框架、普通 Agent、私有工作区、临时共享工作区和长期归档之间的信息流。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 32px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #475569; }
      .section-title { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #475569; }
      .arrow-text { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #334155; }
      .note-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #0f172a; }
      .note { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #334155; }
      .box { filter: url(#soft-shadow); }
      .user { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .top { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; }
      .framework { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .agent { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .private { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .shared { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
      .archive { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .note-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#soft-shadow); }
      .blue-line { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #059669; stroke-width: 2.4; fill: none; marker-end: url(#arrow-green); }
      .amber-line { stroke: #d97706; stroke-width: 2.4; fill: none; marker-end: url(#arrow-amber); }
      .thin { stroke-width: 2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="940"/>
  <text class="title" x="64" y="56">Agents 协同工作与工作区流转</text>
  <text class="subtitle" x="64" y="86">总控 Agent 负责理解和拆解；框架负责通信、调度、合并、状态和归档；普通 Agent 只在授权边界内完成局部任务。</text>

  <!-- Top coordination row -->
  <rect class="box user" x="64" y="130" width="190" height="94" rx="14"/>
  <text class="label" x="92" y="166">用户 / 桌面界面</text>
  <text class="body" x="92" y="194">提出目标、查看进展</text>

  <rect class="box top" x="334" y="118" width="236" height="118" rx="14"/>
  <text class="label" x="376" y="156">总控 Agent</text>
  <text class="body" x="366" y="185">理解目标 · 拆解任务</text>
  <text class="body" x="366" y="209">解释状态 · 发起收口</text>

  <rect class="box framework" x="672" y="108" width="468" height="138" rx="16"/>
  <text class="label" x="724" y="148">框架调度与消息中心</text>
  <text class="body" x="714" y="180">校验计划、排队投递、等待汇合、记录事件</text>
  <text class="body" x="714" y="205">控制共享写入、冲突处理、最终报告和归档</text>

  <path class="blue-line" d="M254 177 C282 177, 300 177, 334 177"/>
  <text class="arrow-text" x="268" y="164">目标 / 追问</text>
  <path class="blue-line" d="M570 177 C610 177, 626 177, 672 177"/>
  <text class="arrow-text" x="594" y="164">计划 / 状态请求</text>

  <!-- Agents layer -->
  <text class="section-title" x="64" y="302">普通 Agent 工作层</text>
  <rect class="box agent" x="64" y="326" width="250" height="112" rx="14"/>
  <text class="label" x="106" y="362">Agent A</text>
  <text class="body" x="96" y="391">处理一个子任务</text>
  <text class="small" x="96" y="416">只拿到本轮需要的上下文</text>

  <rect class="box agent" x="368" y="326" width="250" height="112" rx="14"/>
  <text class="label" x="410" y="362">Agent B</text>
  <text class="body" x="400" y="391">并行处理另一个子任务</text>
  <text class="small" x="400" y="416">按要求提交消息意图</text>

  <rect class="box agent" x="672" y="326" width="250" height="112" rx="14"/>
  <text class="label" x="704" y="362">汇总 / 评审 Agent</text>
  <text class="body" x="704" y="391">接收框架整理后的汇总包</text>
  <text class="small" x="704" y="416">评审、合并判断、补充报告</text>

  <path class="blue-line" d="M820 246 C760 282, 270 282, 190 326"/>
  <path class="blue-line" d="M902 246 C844 286, 566 286, 494 326"/>
  <text class="arrow-text" x="410" y="286">下发任务与上下文</text>
  <path class="blue-line" d="M314 368 C450 306, 620 282, 710 246"/>
  <path class="blue-line" d="M618 368 C716 314, 788 280, 858 246"/>
  <text class="arrow-text" x="632" y="300">提交消息意图 / 完成回执</text>
  <path class="blue-line" d="M870 246 C866 288, 838 306, 812 326"/>
  <text class="arrow-text" x="882" y="292">汇总后投递</text>

  <!-- Workspace layer -->
  <text class="section-title" x="64" y="498">工作区与成果流转</text>
  <rect class="box private" x="64" y="526" width="414" height="172" rx="16"/>
  <text class="label" x="96" y="564">每个 Agent 的私有工作区</text>
  <text class="body" x="96" y="596">私有代码检出：只在自己的目录里改</text>
  <text class="body" x="96" y="624">私有规则与技能：只暴露授权内容</text>
  <text class="body" x="96" y="652">上下文令牌：调用框架提供的工作区接口</text>

  <rect class="box shared" x="560" y="526" width="452" height="172" rx="16"/>
  <text class="label" x="592" y="564">本次运行的临时共享工作区</text>
  <text class="body" x="592" y="596">代码视图：框架接受变更后统一合并</text>
  <text class="body" x="592" y="624">报告与产物：供总控查看、供下游引用</text>
  <text class="body" x="592" y="652">变更与冲突：保留可追溯记录</text>

  <rect class="box archive" x="1060" y="548" width="156" height="128" rx="16"/>
  <text class="label" x="1095" y="586">长期归档</text>
  <text class="small" x="1086" y="618">完成后保存</text>
  <text class="small" x="1086" y="640">报告 / 产物</text>
  <text class="small" x="1086" y="662">变更 / 冲突</text>

  <path class="green-line" d="M178 438 C150 470, 142 494, 170 526"/>
  <path class="green-line" d="M490 438 C400 478, 344 498, 302 526"/>
  <text class="arrow-text" x="196" y="484">私有修改</text>
  <path class="amber-line" d="M478 592 C510 592, 526 592, 560 592"/>
  <text class="arrow-text" x="494" y="580">提交变更</text>
  <path class="amber-line" d="M478 648 C510 654, 526 658, 560 662"/>
  <text class="arrow-text" x="488" y="676">发布报告 / 产物</text>
  <path class="amber-line" d="M1012 612 C1030 612, 1040 612, 1060 612"/>
  <text class="arrow-text" x="1016" y="600">收口</text>
  <path class="blue-line thin" d="M786 526 C822 490, 820 464, 802 438"/>
  <text class="arrow-text" x="830" y="485">共享结果进入汇总</text>

  <!-- Bottom explanation -->
  <rect class="note-card" x="64" y="756" width="1152" height="122" rx="16"/>
  <text class="note-title" x="96" y="792">中文说明</text>
  <text class="note" x="96" y="824">1. 普通 Agent 不直接互相私聊，也不直接写共享区；它只在自己的私有目录工作，并把“想发给谁、产出了什么”提交给框架。</text>
  <text class="note" x="96" y="852">2. 临时共享工作区由框架统一管理：接受代码变更、保存报告和产物、记录冲突，供总控 Agent 和下游 Agent 查看。</text>
  <text class="note" x="96" y="880">3. 运行结束时，临时共享区里的成果进入长期归档；私有缓存、会话状态和未发布草稿不会被自动当作成果保存。</text>
</svg>
